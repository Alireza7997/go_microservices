syntax = "proto3";

import "general/general.proto";

package microservice.auth;
option go_package = "microservice/auth/auth_pb";


message User {
    string user_name    = 1;
    string first_name   = 2;
    string last_name    = 3;
    string password     = 4;
    string email        = 5;
    int64  created_at   = 6;
}

message RegisterRequest {
    string user_name     = 1;
    string password         = 2;
    string confirm_password = 3;
    string email            = 4;
}

message RegisterResponse {
    general.Error err = 1;
    int64 userID = 2;
}

service AuthService{
    rpc Register(RegisterRequest) returns (RegisterResponse) {};
}
syntax = "proto3";

package auth;
option go_package = "microservice/auth/auth_pb";


message User {
    string first_name   = 1;
    string last_name    = 2;
    string display_name = 3;
    string password     = 4;
    string email        = 5;
    int64  created_at   = 6;
}

message RegisterRequest {
    string display_name     = 1;
    string password         = 2;
    string confirm_password = 3;
    string email            = 4;
}

message RegisterResponse {
    string err = 1;
}

service AuthService{
    rpc Register(RegisterRequest) returns (RegisterResponse) {};
}